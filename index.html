<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<script>
if (location.hostname.endsWith("github.io")) {
  document.write('<base href="/yunhai-shangtu/">');
}
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>雲海商途：蒼穹誓約</title>
<style>
  :root {
    --ink: #4A3525;
    --gold: #F0C14A;
    --pink: #FF7B93;
    --mp: #5EC4FF;
    --exp: #F3C13A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; touch-action: manipulation; pointer-events: auto; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87C6EF; font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: var(--ink); touch-action: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud button, #hud .hit, #prompt, #drawer button, .card, .go, .opt, input { pointer-events: auto; cursor: pointer; font-family: inherit; }

  /* ===== Top-left status ===== */
  #status {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 10px;
    display: flex; gap: 8px; align-items: center;
    background: transparent; padding: 0;
    min-width: 260px; max-width: 52vw;
  }
  #face {
    width: 86px; height: 84px; border: 0; border-radius: 0;
    background: url("assets/ui/portrait-frame.png") center / contain no-repeat;
    box-shadow: none; overflow: visible; flex: none; position: relative;
  }
  #face canvas {
    position: absolute; display: block; border-radius: 50%; overflow: hidden;
    width: 68.8%; height: 70.4%; left: 52.4%; top: 51.5%;
    transform: translate(-50%, -50%); background: #F8D7B0;
  }
  #face { z-index: 1; }
  #status .col { flex: 1; min-width: 0; padding: 8px 14px 8px 22px; margin-left: -16px;
    background: rgba(255,252,245,.94); border-radius: 0 18px 18px 0;
    box-shadow: 0 4px 12px rgba(74,53,37,.16);
    text-shadow: 0 1px 0 rgba(255,248,232,.9); }
  #hero-title { font-weight: 800; font-size: 14px; letter-spacing: .02em; color: #5A3A1C; }
  #hero-title span { color: #3AA0E8; margin-right: 2px; }
  .stat { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  .stat label { font-size: 10px; font-weight: 800; width: 24px; color: #8A6A4A; }
  .bar { flex: 1; height: 14px; border-radius: 0; overflow: hidden; position: relative;
    background: url("assets/ui/bar-track.png") center / 100% 100% no-repeat; background-color: transparent; }
  .bar i, .bar b {
    display: block; height: 100%; position: absolute; left: 0; top: 0; border-radius: 0;
    background-repeat: no-repeat; background-position: left center;
    background-size: var(--bw, 100%) 100%;
  }
  #hp-white { background: #F4C8C0; opacity: .7; }
  #hp-fill { background-image: url("assets/ui/bar-hp.png"); }
  #mp-fill { background-image: url("assets/ui/bar-mp.png"); }
  #exp-fill-top { background-image: url("assets/ui/bar-exp-fill.png"); }
  #exp-pct { font-size: 9px; font-weight: 700; color: #8A6A4A; width: 42px; text-align: right; }

  /* ===== Center wooden sign ===== */
  #area-sign {
    position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); text-align: center; pointer-events: none;
    min-width: 200px;
  }
  #area-board {
    display: inline-block;
    background: url("assets/ui/area-sign.png") center / 100% 100% no-repeat;
    border: 0; border-radius: 0; box-shadow: none;
    padding: 26px 46px 18px;
    color: #FFF8E8; font-weight: 900; font-size: 18px; letter-spacing: .1em;
    text-shadow: 0 2px 0 rgba(74,53,37,.45);
    min-width: 240px;
    line-height: 1.15;
  }
  #area-title { font-size: 18px; }
  #area-sub { margin-top: 2px; font-size: 11px; font-weight: 700; color: #FFF3D0;
    letter-spacing: .06em; text-shadow: 0 1px 0 rgba(74,53,37,.4); }
  #area-auto { margin-top: 2px; font-size: 12px; font-weight: 800; color: #3A8A2A;
    text-shadow: 0 1px 0 #fff; opacity: 0; transition: opacity .2s; }
  #area-auto.on { opacity: 1; }

  /* ===== Top-right ===== */
  #rt { position: absolute; top: max(10px, env(safe-area-inset-top)); right: 10px; display: flex; gap: 8px; align-items: flex-start; }
  #minimap {
    width: 112px; height: 113px; border: 0; border-radius: 0; box-shadow: none;
    overflow: visible; background: url("assets/ui/minimap-frame.png") center / contain no-repeat;
    position: relative;
  }
  #minimap canvas {
    position: absolute; display: block; border-radius: 50%;
    width: 74%; height: 75%; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  #rt-btns { display: flex; flex-direction: column; gap: 6px; }
  .side-btn {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    background: transparent; border: 0; color: #4A3525;
  }
  .side-btn i {
    width: 44px; height: 44px; border-radius: 0; border: 0; box-shadow: none;
    display: block; font-style: normal; font-size: 0;
    background: url("assets/ui/btn-settings.png") center / contain no-repeat;
  }
  #menu-btn i { background-image: url("assets/ui/btn-menu.png"); }
  #auto-hunt i { background-image: url("assets/icons/sk-auto.png"); }
  .side-btn span { font-size: 10px; font-weight: 800; text-shadow: 0 1px 0 #fff; }
  .side-btn.on i { filter: brightness(1.12) saturate(1.15); }

  #drawer {
    position: absolute; top: 150px; right: 10px; width: min(230px, 70vw);
    background: rgba(255,252,245,.96); border: 3px solid #E8B84A; border-radius: 16px;
    box-shadow: 0 8px 20px rgba(74,53,37,.25); padding: 8px; display: none; pointer-events: auto; z-index: 8;
  }
  #drawer.open { display: block; }
  #drawer button { width: 100%; text-align: left; padding: 8px 10px; margin: 3px 0; border: 0; border-radius: 10px; background: #F7E8C6; color: var(--ink); font-weight: 700; font-size: 13px; }

  /* ===== Bottom left log ===== */
  #log-wrap {
    position: absolute; left: 12px; bottom: max(16px, env(safe-area-inset-bottom));
    display: flex; align-items: flex-end; gap: 8px; pointer-events: none;
  }
  #log {
    width: min(280px, 36vw); font-size: 11px; line-height: 1.5;
    background: rgba(40, 28, 16, .45); color: #FFF8E8; border-radius: 12px;
    padding: 6px 10px; text-shadow: 0 1px 1px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
  }
  #log-btns { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  .tiny {
    width: 40px; height: 40px; border-radius: 50%; border: 3px solid #E8B84A;
    background: rgba(255,252,245,.92); box-shadow: 0 3px 0 #C9964A; font-size: 16px;
  }
  #sk-mount {
    background: #FFF8EA url("assets/ui/btn-mount.png") center / 88% 88% no-repeat;
    font-size: 0; color: transparent; overflow: hidden;
  }
  .lg-sys { color: #FF9AB0; font-weight: 800; }
  .lg-get { color: #7EC8FF; font-weight: 800; }
  body:not([data-mode="play"]) #hud { visibility: hidden; }

  /* ===== Bottom center items ===== */
  #items {
    position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto;
  }
  .item {
    width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: transparent url("assets/icons/item-potion.png") center / contain no-repeat;
    box-shadow: none; position: relative; color: transparent; font-size: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #item-scroll { background-image: url("assets/icons/item-scroll.png"); }
  #item-elixir { background-image: url("assets/icons/item-elixir.png"); }
  .item b {
    position: absolute; right: -2px; bottom: -2px; min-width: 18px; height: 18px;
    background: #5A3A1C; border-radius: 8px; font-size: 10px; display: flex;
    align-items: center; justify-content: center; padding: 0 4px; border: 2px solid #E8B84A;
    color: #FFF8E8; font-weight: 800;
  }
  .item:active { transform: scale(.92); }

  /* ===== Bottom right skills ===== */
  #skills {
    position: absolute; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    width: 200px; height: 200px; pointer-events: auto;
  }
  .sk {
    position: absolute; border-radius: 50%; border: 0;
    background: transparent center / contain no-repeat;
    box-shadow: none; color: transparent;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 0;
  }
  #sk-heal { background-image: url("assets/icons/sk-heal.png"); }
  #sk-star { background-image: url("assets/icons/sk-star.png"); }
  #sk-shield { background-image: url("assets/icons/sk-shield.png"); }
  #sk-auto { background-image: url("assets/icons/sk-auto.png"); }
  #sk-ult { background-image: url("assets/icons/sk-ult.png"); }
  #sk-atk { background-image: url("assets/icons/sk-atk.png"); }
  .sk .cd {
    position: absolute; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #FFE08A;
  }
  .sk:active { transform: scale(.9); }
  .sk .tag { position: absolute; bottom: -16px; font-size: 10px; font-weight: 800; color: #4A3525; text-shadow: 0 1px 0 #fff; }
  #sk-atk { width: 76px; height: 76px; right: 0; bottom: 0; font-size: 0;
    background-image: url("assets/icons/sk-atk.png"); background-size: contain; background-repeat: no-repeat; background-position: center; background-color: transparent; }
  #sk-heal { width: 50px; height: 50px; right: 92px; bottom: 8px; }
  #sk-star { width: 50px; height: 50px; right: 118px; bottom: 62px; }
  #sk-shield { width: 50px; height: 50px; right: 88px; bottom: 112px; }
  #sk-auto { width: 50px; height: 50px; right: 22px; bottom: 86px; border-color: #F0C14A; }
  #sk-ult { width: 44px; height: 44px; right: 148px; bottom: 118px; border-color: #F0C14A; font-size: 16px; }
  #skills.town { opacity: .38; }
  #skills.town:hover, #skills.town:focus-within { opacity: 1; }

  #prompt {
    position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%);
    background: rgba(255,252,245,.94); border-radius: 999px; padding: 6px 16px;
    font-size: 12px; font-weight: 800; display: none; box-shadow: 0 3px 10px rgba(74,53,37,.2);
  }

  .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(40,24,12,.35); pointer-events: auto; }
  .overlay.show { display: flex; }
  .panel {
    width: min(560px, 94vw); max-height: 90vh; overflow: auto;
    background: linear-gradient(180deg, #FFF6E0, #F0D3A0);
    border: 5px solid #C48A3A; border-radius: 22px;
    box-shadow: 0 8px 0 #6A3E16, 0 20px 40px rgba(0,0,0,.3);
    padding: 22px 20px 18px; text-align: center; color: var(--ink);
  }
  .logo { font-size: clamp(26px, 6vw, 40px); font-weight: 900; letter-spacing: .12em; color: #6A3E16; text-shadow: 0 2px 0 #E8B84A; }
  .sub { letter-spacing: .32em; font-size: 11px; opacity: .75; margin: 4px 0 14px; }
  .go, .opt { border: 0; border-radius: 999px; padding: 10px 22px; font-weight: 800; margin: 4px; background: linear-gradient(180deg, #FFE08A, #E8B84A); color: #4A3525; box-shadow: 0 4px 0 #8A6A20; font-family: inherit; }
  .classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .card { border: 3px solid #C48A3A; border-radius: 14px; padding: 8px; background: #FFF8EA; text-align: left; font-family: inherit; color: inherit;
    display: flex; gap: 8px; align-items: center; }
  .card.sel { border-color: #E8B84A; box-shadow: 0 0 0 3px rgba(232,184,74,.45); }
  .card-art { width: 52px; height: 64px; object-fit: contain; flex: none; pointer-events: none; }
  .card h3 { font-size: 14px; } .card p { font-size: 11px; opacity: .8; margin-top: 2px; }
  .title-art { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 140px; margin: 2px 0 6px; pointer-events: none; }
  .title-art img { height: 132px; width: auto; object-fit: contain; }
  .title-art img.shiba { height: 96px; }
  #pv { width: 180px; height: 200px; margin: 0 auto 8px; display: block; }
  .opt.sel { box-shadow: 0 0 0 3px rgba(232,184,74,.45); }
  .gender-note { margin-top: 6px; font-size: 11px; font-weight: 700; color: #8A6A4A; line-height: 1.5; }
  .name-row { margin: 12px auto 4px; text-align: left; width: min(320px, 100%); }
  .name-row label { display: block; font-size: 12px; font-weight: 800; color: #8A6A4A; margin-bottom: 6px; letter-spacing: .06em; }
  #hero-name-input {
    width: 100%; border: 3px solid #C48A3A; border-radius: 12px; background: #FFF8EA;
    color: #4A3525; font-family: inherit; font-size: 16px; font-weight: 700;
    padding: 8px 12px; outline: none; text-align: center; box-shadow: inset 0 1px 0 #fff;
    cursor: text;
  }
  #hero-name-input:focus { border-color: #E8B84A; box-shadow: 0 0 0 3px rgba(232,184,74,.45); }
  #hero-name-input::placeholder { color: #C4A078; font-weight: 600; }
  .name-hint { min-height: 1.4em; margin: 4px 0 8px; font-size: 12px; font-weight: 700; color: #C45A3A; text-align: center; }
  .save-summary {
    font-size: 13px; font-weight: 700; color: #5A3A1C; background: #FFF8EA;
    border: 2px solid #E8B84A; border-radius: 12px; padding: 8px 12px; margin: 0 auto 12px;
  }
  #title-confirm p { font-size: 14px; line-height: 1.7; margin: 0 0 12px; }
  #dialog .panel { text-align: left; }
  #load { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; flex-direction: column; background: #87C6EF; color: #4A3525; }
  #load bar { width: 200px; height: 10px; background: #fff8; border-radius: 8px; overflow: hidden; margin-top: 12px; display: block; border: 2px solid #4A3525; }
  #load i { display: block; height: 100%; width: 0; background: #E8B84A; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="status">
    <div id="face"><canvas id="face-c" width="104" height="104"></canvas></div>
    <div class="col">
      <div id="hero-title"><span id="hero-lv">Lv.1</span> <span id="hero-name" style="color:#5A3A1C">旅人</span></div>
      <div class="stat"><label>HP</label><div class="bar"><b id="hp-white" style="width:100%"></b><i id="hp-fill"></i></div></div>
      <div class="stat"><label>MP</label><div class="bar"><i id="mp-fill"></i></div></div>
      <div class="stat"><label>EXP</label><div class="bar"><i id="exp-fill-top"></i></div><span id="exp-pct">0%</span></div>
    </div>
  </div>

  <div id="area-sign">
    <div id="area-board">
      <div id="area-title">風車鎮廣場</div>
      <div id="area-sub">安全區域 · 主城</div>
    </div>
    <div id="area-auto">✦ 自動狩獵中… ✦</div>
  </div>

  <div id="rt">
    <div id="minimap"><canvas id="mm" width="184" height="184"></canvas></div>
    <div id="rt-btns">
      <button class="side-btn" id="bgm-btn" type="button"><i></i><span>設置</span></button>
      <button class="side-btn" id="menu-btn" type="button"><i></i><span>選單</span></button>
      <button class="side-btn" id="auto-hunt" type="button"><i></i><span>自動狩獵</span></button>
    </div>
  </div>
  <div id="drawer">
    <button data-p="stat" type="button">🧍 屬性</button>
    <button data-p="eq" type="button">⚔️ 裝備與星軌齒輪</button>
    <button data-p="skill" type="button">🌳 技能樹</button>
    <button data-p="mount" type="button">🐉 坐騎</button>
    <button data-p="pet" type="button">🐾 靈獸</button>
    <button data-p="trade" type="button">💰 跑商茶座</button>
    <button data-p="map" type="button">🗺️ 空島地圖</button>
    <button data-p="bestiary" type="button">📖 魔物圖鑑</button>
  </div>

  <div id="log-wrap">
    <div id="log"></div>
    <div id="log-btns">
      <button class="tiny" id="btn-chat" type="button" title="對話">💬</button>
      <button class="tiny" id="sk-mount" type="button" title="坐騎 阿柴">🐕</button>
    </div>
  </div>

  <div id="items">
    <button class="item" id="item-potion" type="button" title="回復藥水"><b id="n-potion">5</b></button>
    <button class="item" id="item-scroll" type="button" title="回城卷軸"><b id="n-scroll">3</b></button>
    <button class="item" id="item-elixir" type="button" title="魔力靈飲"><b id="n-elixir">4</b></button>
  </div>

  <div id="skills">
    <button class="sk" id="sk-ult" type="button" title="終極奧義"><span class="cd"></span></button>
    <button class="sk" id="sk-shield" type="button" title="技能"><span class="cd"></span></button>
    <button class="sk" id="sk-star" type="button" title="技能"><span class="cd"></span></button>
    <button class="sk" id="sk-heal" type="button" title="技能"><span class="cd"></span></button>
    <button class="sk" id="sk-auto" type="button" title="自動"><span class="tag">自動</span></button>
    <button class="sk" id="sk-atk" type="button" title="普攻"></button>
  </div>
  <div id="prompt"></div>
</div>

<div id="load"><div class="logo">雲海商途</div><div class="sub">蒼穹誓約</div><div>正在裝載艾瑟蘭的雲海…</div><bar><i id="load-bar"></i></bar></div>

<div class="overlay show" id="title">
  <div class="panel">
    <div class="sub">AETHERLAND  ·  CLOUD SEA TRADE</div>
    <div class="logo">雲海商途</div>
    <div class="sub">蒼穹誓約</div>
    <div class="title-art">
      <img src="assets/chars/beginner_idle.png" alt="">
      <img class="shiba" src="assets/shiba/shiba_idle2.png" alt="">
    </div>
    <p style="font-size:14px;line-height:1.8;margin:10px 0 18px">歡迎來到浮空大陸艾瑟蘭。<br>以初心者出發，到 20 等再向艾莉亞選擇第一個職業。</p>
    <div id="title-fresh">
      <button class="go" id="btn-begin" type="button">開始冒險</button>
    </div>
    <div id="title-continue" style="display:none">
      <div class="save-summary" id="save-summary"></div>
      <button class="go" id="btn-continue" type="button">繼續冒險</button>
      <button class="opt" id="btn-new" type="button">開新存檔</button>
    </div>
    <div id="title-confirm" style="display:none">
      <p id="title-confirm-text">開新存檔會覆蓋現有進度，確定要重新開始嗎？</p>
      <button class="go" id="btn-new-ok" type="button">確定開新存檔</button>
      <button class="opt" id="btn-new-cancel" type="button">取消</button>
    </div>
  </div>
</div>

<div class="overlay" id="create">
  <div class="panel">
    <div class="logo" style="font-size:24px;letter-spacing:.08em">建立角色</div>
    <canvas id="pv" width="180" height="200"></canvas>
    <p style="font-size:13px;line-height:1.7;margin:0 0 10px">你會以初心者踏出第一步。到 20 等，再向廣場的艾莉亞選擇第一條傳承。</p>
    <div class="classes" id="class-list" style="display:none"></div>
    <div>
      <button class="opt" id="btn-male" type="button">男性</button>
      <button class="opt" id="btn-female" type="button">女性</button>
      <div class="gender-note">第一期外觀跟官方立繪；性別會先記低，等有雙性別立繪再分開。</div>
    </div>
    <div class="name-row">
      <label for="hero-name-input">角色名</label>
      <input id="hero-name-input" type="text" maxlength="8" placeholder="旅人" autocomplete="off" spellcheck="false" enterkeyhint="done" />
      <div class="name-hint" id="name-hint"></div>
    </div>
    <button class="go" id="btn-enter" type="button">進入風車鎮</button>
  </div>
</div>


<div class="overlay" id="job-pick">
  <div class="panel">
    <div class="logo" style="font-size:24px;letter-spacing:.08em">選擇第一個職業</div>
    <p style="font-size:14px;line-height:1.7;margin:8px 0 14px">到了 20 等，可以向艾莉亞選擇第一條傳承。選定後，這一期就沿著這條路走下去。</p>
    <div class="classes" id="job-list"></div>
    <button class="go" id="btn-job-ok" type="button">確定轉職</button>
    <button class="opt" id="btn-job-cancel" type="button">再想想</button>
  </div>
</div>

<div class="overlay" id="dialog">
  <div class="panel">
    <h3 id="dlg-title"></h3>
    <p id="dlg-body" style="font-size:14px;line-height:1.7"></p>
    <div style="text-align:right;margin-top:12px"><button class="go" id="dlg-ok" type="button">好的</button></div>
  </div>
</div>
